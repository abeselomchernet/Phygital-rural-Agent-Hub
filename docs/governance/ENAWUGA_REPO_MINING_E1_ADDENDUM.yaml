    - "legacy Hub Ledger First screens as current capability evidence"
    - "ARDI/Agri Score as Enawuga core dependency"
    - "CICO/Ekub/PAYG/payment controls as current live authority"
    - "KinetiQ/AgriTrust/IoT/device-control screens as current integration evidence"
    - "Fayda/live identity implications"
    - "Hyperledger/Fabric artifacts as current audit architecture"
    - "Vercel production-target label as financial-production evidence"
    - "Vercel deployment as Ethiopia-resident Stage-4 hosting evidence"
    - "historical private-key/CA material, database dumps/backups, environment files, logs, backup source files, committed dependencies"

security_follow_up:
  required: true
  note: "Historical enawuga-nexus and sovereign_core contain credential/key-shaped, CA, backup/database, environment/log or temporary artifacts. Perform a separate secret-history, exposure, credential-rotation and repository-hygiene review before external sharing, reuse or any change in repository visibility. Do not migrate secret material."
