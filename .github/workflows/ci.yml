name: Synthetic prototype validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enawuga_d1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enawuga_d1_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATA_MODE: synthetic
      ALLOW_EXTERNAL_TELEMETRY: "false"
      D1_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/enawuga_d1_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enforce production dependency audit
        run: npm audit --omit=dev
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate synthetic Docker image
        run: docker build -t enawuga-synthetic-demo:pr .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
