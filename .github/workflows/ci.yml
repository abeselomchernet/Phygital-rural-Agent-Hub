name: Enawuga Phygital Nexus CI/CD Pipeline

on:
  push:
    branches: [ main, staging, production ]
  pull_request:
    branches: [ main, staging ]

jobs:
  Verify-Codebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install Secure Dependencies
        run: npm ci
        
      - name: Type Check & TypeScript Lint
        run: npm run lint
        
      - name: Production Vite Build Verification
        run: npm run build
      
      - name: Start Application Server
        # The '-- --port 3005 --strictPort' forces Vite/Node to bind exactly to 3005
        # instead of defaulting to 5173 or searching for the next open port.
        run: |
          npm run dev -- --port 3005 --strictPort > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          sleep 5
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "❌ Server failed to start on localized port config!"
            cat server.log
            exit 1
          fi
        env:
          NODE_ENV: development
          PORT: 3005
      
      - name: Wait for Server to be Ready
        # Increased timeout to 90s. If it fails, it will now print the server log automatically.
        run: |
          if ! npx wait-on http://localhost:3005 --timeout 90000 --interval 500; then
            echo "❌ wait-on timed out! Dumping server output for debugging:"
            cat server.log
            exit 1
          fi
      
      - name: Verify Server Health
        run: curl -f http://localhost:3005/api/health || (echo "Health check failed" && cat server.log && exit 1)
      
      - name: Run Node.js E2E Smoke Tests
        run: npx tsx scripts/smoke-test.ts
        env:
          TARGET_PORT: 3005

  Verify-Docker-Grid:
    needs: Verify-Codebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Test Docker Compose Orchestration
        run: docker-compose build
        env:
          APP_PORT: 3005