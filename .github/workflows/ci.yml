name: Synthetic prototype validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATA_MODE: synthetic
      ALLOW_EXTERNAL_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enforce production dependency audit
        run: npm audit --omit=dev
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate synthetic Docker image
        run: docker build -t enawuga-synthetic-demo:pr .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
