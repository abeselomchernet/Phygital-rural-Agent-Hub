name: Sovereign Nexus CI/CD PIPELINE

on:
  push:
    branches: [ main, staging, production ]
  pull_request:
    branches: [ main, staging ]

jobs:
  Verify-Codebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install Secure Dependencies
        run: npm ci
        
      - name: Type Check & TypeScript Lint
        run: npm run lint
        
      - name: Production Vite Build Verification
        run: npm run build
      
      - name: Start Application Server
        run: |
          npm run dev > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          sleep 3
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "❌ Server failed to start!"
            cat server.log
            exit 1
          fi
        env:
          NODE_ENV: development
      
      - name: Wait for Server to be Ready
        run: npx wait-on http://localhost:3000 --timeout 60000 --interval 500
      
      - name: Verify Server Health
        run: curl -f http://localhost:3000/api/health || (echo "Health check failed" && cat server.log && exit 1)
      
      - name: Run Node.js E2E Smoke Tests
        run: npx tsx scripts/smoke-test.ts

  Verify-Docker-Grid:
    needs: Verify-Codebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose
      
      - name: Test Docker Compose Orchestration
        run: docker-compose build