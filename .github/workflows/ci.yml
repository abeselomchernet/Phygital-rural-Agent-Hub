name: Sovereign Nexus CI/CD PIPELINE

on:
  push:
    branches: [ main, staging, production ]
  pull_request:
    branches: [ main, staging ]

jobs:
  Verify-Codebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install Secure Dependencies
        run: npm ci
        
      - name: Type Check & TypeScript Lint
        run: npm run lint
        
      - name: Production Vite Build Verification
        run: npm run build
        
      - name: Run Node.js E2E Smoke Tests
        run: npx tsx scripts/smoke-test.ts

  Verify-Docker-Grid:
    needs: Verify-Codebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Test Docker Compose Orchestration
        run: docker-compose build
