name: Temporary Telebirr TestBed TLS probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/telebirr-sandbox-adapter
    paths:
      - .github/workflows/telebirr-testbed-tls-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe documented Telebirr TestBed endpoints without credentials
        shell: bash
        run: |
          set -u
          HOST_URL='https://developerportal.ethiotelebirr.et:38443/apiaccess/payment/gateway'
          IP_URL='https://196.188.120.3:38443/apiaccess/payment/gateway'
          HOST='developerportal.ethiotelebirr.et'
          PORT='38443'
          IP='196.188.120.3'

          probe() {
            local label="$1"; shift
            echo "== ${label} =="
            set +e
            output=$(curl --silent --show-error --location --max-time 20 --connect-timeout 10 \
              --output /dev/null --write-out 'http=%{http_code} ssl_verify=%{ssl_verify_result} remote_ip=%{remote_ip}\n' "$@" 2>&1)
            code=$?
            set -e
            echo "$output"
            echo "curl_exit=${code}"
          }

          set -e
          probe 'hostname-standard-tls' "$HOST_URL"
          probe 'hostname-forced-to-postman-ip' --resolve "${HOST}:${PORT}:${IP}" "$HOST_URL"
          probe 'raw-ip-standard-tls' "$IP_URL"

          echo 'TLS probe completed. No credentials, POST requests, or payment mutations were used.'
