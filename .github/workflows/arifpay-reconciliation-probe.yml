name: Temporary ArifPay reconciliation probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/arifpay-sandbox-adapter'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe sandbox-prefixed forms of published verification routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://gateway.arifpay.org'
          key='arif-sandbox-portal-key'
          nonce="enawuga_verifyprobe_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_$(date +%s)"

          jq -n --arg nonce "$nonce" '{
            cancelUrl: "https://payment.arifpay.org/Cancel",
            phone: "251911000000",
            email: "sandbox@example.com",
            nonce: $nonce,
            errorUrl: "https://payment.arifpay.org/Error",
            notifyUrl: "http://localhost:3000/api/sandbox/webhook-inbox",
            successUrl: "https://payment.arifpay.org/success",
            expireDate: "2027-12-31T23:59:00",
            amount: 10,
            items: [{name:"Enawuga verify probe",quantity:1,price:10,description:"Synthetic sandbox verification"}],
            lang: "EN"
          }' > create.json

          create_code=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
            --output create-response.json --write-out '%{http_code}' \
            -X POST "$base/api/sandbox/c2b/session" \
            -H 'Content-Type: application/json' -H "x-arifpay-key: $key" \
            -H 'x-arifpay-sim-mode: SUCCESS' -H 'x-arifpay-fee-source: MERCHANT' \
            --data @create.json)
          sid=$(jq -r '.data.sessionId // .data.uuid // .sessionId // empty' create-response.json)
          test "$create_code" = '200'; test -n "$sid"

          jq -n --arg sid "$sid" '{sessionId:$sid,phoneNumber:"251900000000"}' > transfer.json
          transfer_code=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
            --output transfer-response.json --write-out '%{http_code}' \
            -X POST "$base/api/sandbox/c2b/telebirr-ussd/transfer" \
            -H 'Content-Type: application/json' -H "x-arifpay-key: $key" \
            -H 'x-arifpay-sim-mode: SUCCESS' -H 'x-arifpay-fee-source: MERCHANT' \
            --data @transfer.json)
          txn=$(jq -r '.data.transaction.transactionId // .data.transactionId // .transaction.transactionId // .transactionId // empty' transfer-response.json 2>/dev/null || true)
          echo "create_http=$create_code transfer_http=$transfer_code transaction_reference_present=$([ -n "$txn" ] && echo true || echo false)"

          probe_get() {
            label="$1"; url="$2"; outfile="$3"
            code=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
              --output "$outfile" --write-out '%{http_code}' \
              -H 'Content-Type: application/json' -H "x-arifpay-key: $key" "$url" || true)
            err=$(jq -r '.error // "unknown"' "$outfile" 2>/dev/null || echo nonjson)
            msg=$(jq -r '.msg // .message // ""' "$outfile" 2>/dev/null || true)
            status=$(jq -r '.data.transactionStatus // .data.status // .transactionStatus // .status // .data.transaction.transactionStatus // ""' "$outfile" 2>/dev/null || true)
            data_present=$(jq -r 'if has("data") and .data != null then "true" else "false" end' "$outfile" 2>/dev/null || echo false)
            echo "$label http=$code error=$err status=${status:-none} data_present=$data_present msg=${msg:0:80}"
          }

          probe_get sandbox_checkout_session "$base/api/sandbox/checkout/session/$sid" sandbox-session.json
          probe_get sandbox_verify_session "$base/api/sandbox/verify/transaction?uuid=$sid" sandbox-verify-session.json
          probe_get sandbox_verify_nonce "$base/api/sandbox/checkout/getSessionByNonce/$nonce" sandbox-verify-nonce.json

          if [ -n "$txn" ]; then
            jq -n --arg txn "$txn" '{transactionId:$txn,paymentType:"TELEBIRR_USSD"}' > verify-txn.json
            code=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
              --output verify-txn-response.json --write-out '%{http_code}' \
              -X POST "$base/api/sandbox/checkout/getSessionByTransactionId" \
              -H 'Content-Type: application/json' -H "x-arifpay-key: $key" \
              --data @verify-txn.json || true)
            err=$(jq -r '.error // "unknown"' verify-txn-response.json 2>/dev/null || echo nonjson)
            msg=$(jq -r '.msg // .message // ""' verify-txn-response.json 2>/dev/null || true)
            status=$(jq -r '.data.transactionStatus // .data.status // .transactionStatus // .status // .data.transaction.transactionStatus // ""' verify-txn-response.json 2>/dev/null || true)
            data_present=$(jq -r 'if has("data") and .data != null then "true" else "false" end' verify-txn-response.json 2>/dev/null || echo false)
            echo "sandbox_verify_transaction http=$code error=$err status=${status:-none} data_present=$data_present msg=${msg:0:80}"
          fi
