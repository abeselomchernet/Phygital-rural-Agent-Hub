name: Temporary ArifPay reconciliation probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/arifpay-sandbox-adapter'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe sandbox session-read route and transfer response shape
        shell: bash
        run: |
          set -euo pipefail
          base='https://gateway.arifpay.org'
          key='arif-sandbox-portal-key'
          nonce="enawuga_readprobe_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_$(date +%s)"

          jq -n --arg nonce "$nonce" '{
            cancelUrl: "https://payment.arifpay.org/Cancel",
            phone: "251911000000",
            email: "sandbox@example.com",
            nonce: $nonce,
            errorUrl: "https://payment.arifpay.org/Error",
            notifyUrl: "http://localhost:3000/api/sandbox/webhook-inbox",
            successUrl: "https://payment.arifpay.org/success",
            expireDate: "2027-12-31T23:59:00",
            amount: 10,
            items: [{name:"Enawuga sandbox read probe",quantity:1,price:10,description:"Synthetic sandbox verification"}],
            lang: "EN"
          }' > create.json

          create_code=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
            --output create-response.json --write-out '%{http_code}' \
            -X POST "$base/api/sandbox/c2b/session" \
            -H 'Content-Type: application/json' \
            -H "x-arifpay-key: $key" \
            -H 'x-arifpay-sim-mode: SUCCESS' \
            -H 'x-arifpay-fee-source: MERCHANT' \
            --data @create.json)
          sid=$(jq -r '.data.sessionId // .data.uuid // .sessionId // empty' create-response.json)
          test "$create_code" = '200'
          test -n "$sid"
          echo "create_http=$create_code"

          before_code=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
            --output before.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H "x-arifpay-key: $key" \
            "$base/api/sandbox/c2b/session/$sid" || true)
          before_error=$(jq -r '.error // "unknown"' before.json 2>/dev/null || echo nonjson)
          before_status=$(jq -r '.data.transactionStatus // .data.status // .transactionStatus // .status // ""' before.json 2>/dev/null || true)
          before_msg=$(jq -r '.msg // ""' before.json 2>/dev/null || true)
          echo "sandbox_session_before http=$before_code error=$before_error status=${before_status:-none} msg=${before_msg:0:80}"

          jq -n --arg sid "$sid" '{sessionId:$sid,phoneNumber:"251900000000"}' > transfer.json
          transfer_code=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
            --output transfer-response.json --write-out '%{http_code}' \
            -X POST "$base/api/sandbox/c2b/telebirr-ussd/transfer" \
            -H 'Content-Type: application/json' \
            -H "x-arifpay-key: $key" \
            -H 'x-arifpay-sim-mode: SUCCESS' \
            -H 'x-arifpay-fee-source: MERCHANT' \
            --data @transfer.json)
          transfer_error=$(jq -r '.error // "unknown"' transfer-response.json 2>/dev/null || echo nonjson)
          transfer_status=$(jq -r '.data.transaction.transactionStatus // .data.transactionStatus // .transaction.transactionStatus // .transactionStatus // .status // ""' transfer-response.json 2>/dev/null || true)
          txn_present=$(jq -r '((.data.transaction.transactionId // .data.transactionId // .transaction.transactionId // .transactionId // null) != null)' transfer-response.json 2>/dev/null || echo false)
          top_keys=$(jq -r 'keys|join(",")' transfer-response.json 2>/dev/null || echo nonjson)
          data_keys=$(jq -r 'if (.data|type)=="object" then (.data|keys|join(",")) else "none" end' transfer-response.json 2>/dev/null || echo nonjson)
          echo "telebirr_transfer http=$transfer_code error=$transfer_error status=${transfer_status:-none} txn_present=$txn_present top_keys=$top_keys data_keys=$data_keys"

          after_code=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
            --output after.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H "x-arifpay-key: $key" \
            "$base/api/sandbox/c2b/session/$sid" || true)
          after_error=$(jq -r '.error // "unknown"' after.json 2>/dev/null || echo nonjson)
          after_status=$(jq -r '.data.transactionStatus // .data.status // .transactionStatus // .status // .data.transaction.transactionStatus // ""' after.json 2>/dev/null || true)
          after_msg=$(jq -r '.msg // ""' after.json 2>/dev/null || true)
          after_top_keys=$(jq -r 'keys|join(",")' after.json 2>/dev/null || echo nonjson)
          after_data_keys=$(jq -r 'if (.data|type)=="object" then (.data|keys|join(",")) else "none" end' after.json 2>/dev/null || echo nonjson)
          echo "sandbox_session_after http=$after_code error=$after_error status=${after_status:-none} msg=${after_msg:0:80} top_keys=$after_top_keys data_keys=$after_data_keys"
